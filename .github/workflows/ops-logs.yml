# Read-only: recent logs of a Studio Cloud Run service or job, as ops-reader (logging.viewer, run.viewer). Keyless (WIF).
# Studio's WIF provider trusts this repo's main and beta only, so dispatch with --ref main (or beta).
#   gh workflow run ops-logs.yml --repo jgriffith3433/hawkesstudio --ref main -f target=studio -f lane=production -f minutes=30 -f severity=WARNING
name: ops-logs
on:
  workflow_dispatch:
    inputs:
      target:
        description: studio (the service), studio-agent (the agents' job), cell-agent, or cell (a customer's Studio, with org)
        type: choice
        options: [studio, studio-agent, cell-agent, cell]
        default: studio
      org:
        description: "cell: the org id (e.g. j-studio-4f12)"
        type: string
        default: ''
      lane:
        type: choice
        options: [production, beta]
        default: production
      minutes:
        description: 5 to 120
        type: number
        default: 30
      severity:
        type: choice
        options: [DEFAULT, INFO, WARNING, ERROR]
        default: WARNING
      revision:
        description: "Optional: only this revision's logs (e.g. studio-00042-abc), to see a new revision that failed to start"
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
concurrency:
  group: ops-logs-${{ inputs.lane }}
  cancel-in-progress: true
jobs:
  logs:
    name: Logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the inputs
        env:
          MINUTES: ${{ inputs.minutes }}
          TARGET: ${{ inputs.target }}
          LANE: ${{ inputs.lane }}
          ORG: ${{ inputs.org }}
          REVISION: ${{ inputs.revision }}
        run: |
          if [ "$TARGET" = cell ]; then [[ "$ORG" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "cell needs org (lower-case letters, digits, dashes)"; exit 1; }; fi
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && [ "$MINUTES" -ge 5 ] && [ "$MINUTES" -le 120 ] || { echo "minutes must be 5 to 120"; exit 1; }
          if [ "$LANE" = beta ]; then
            region="${{ vars.REGION_BETA }}"
            case "$TARGET" in studio) f="resource.type=cloud_run_revision AND resource.labels.service_name=studio-beta";; studio-agent) f="resource.type=cloud_run_job AND resource.labels.job_name=studio-agent-beta";; cell-agent) f="resource.type=cloud_run_job AND resource.labels.job_name=studio-beta-cell-agent";; cell) f="resource.type=cloud_run_revision AND resource.labels.service_name=studio-beta-o-$ORG";; esac
          else
            region="${{ vars.REGION_LIVE }}"
            case "$TARGET" in studio) f="resource.type=cloud_run_revision AND resource.labels.service_name=studio";; studio-agent) f="resource.type=cloud_run_job AND resource.labels.job_name=studio-agent";; cell-agent) f="resource.type=cloud_run_job AND resource.labels.job_name=studio-cell-agent";; cell) f="resource.type=cloud_run_revision AND resource.labels.service_name=studio-o-$ORG";; esac
          fi
          # A cell runs in the cells' region (CELLS_REGION_*), which may not be the lane's: its service name is enough.
          if [ "$TARGET" != cell ]; then f="$f AND resource.labels.location=$region"; fi
          if [ -n "$REVISION" ]; then [[ "$REVISION" =~ ^[a-z0-9-]{1,63}$ ]] || { echo "revision: lower-case letters, digits, dashes"; exit 1; }; f="$f AND resource.labels.revision_name=$REVISION"; fi
          echo "FILTER=$f" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-studio
          service_account: ops-reader@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read
        env:
          MINUTES: ${{ inputs.minutes }}
          SEVERITY: ${{ inputs.severity }}
          PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          since=$(date -u -d "-$MINUTES min" +%Y-%m-%dT%H:%M:%SZ)
          gcloud logging read "$FILTER AND severity>=$SEVERITY AND timestamp>=\"$since\"" --project "$PROJECT" --limit 500 --order asc \
            --format='value(timestamp,severity,resource.labels.revision_name,textPayload,jsonPayload.message,protoPayload.status.message,httpRequest.status,httpRequest.requestUrl)' \
            | sed -E 's/(hg_|hgm_|hs_|ghs_|ghp_|github_pat_|sk-ant-|cfut_|cfat_|AKIA)[A-Za-z0-9_-]+/\1***/g; s/(Bearer |token=|key=)[A-Za-z0-9._-]+/\1***/g' > logs.txt
          n=$(wc -l < logs.txt)
          { echo "### ${{ inputs.target }} (${{ inputs.lane }}), last $MINUTES min, >= $SEVERITY: $n lines"; echo '```'; tail -n 300 logs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$n lines"; tail -n 300 logs.txt
