# Beta's CI (the Deploy workflow, ci.yml) has ended: tell Hawkes Studio, so a go live waiting on that commit's CI looks
# again now (golive-policy.ts autoGoLive). Studio holds no wait of its own for CI, so a restart in between loses
# nothing: on 2026-11-10 (21:42 to 21:48) Studio restarted four times while it waited up to 40 minutes in memory for
# CI, and nothing went live.
#
# Started by the Deploy run's last job (ci.yml "ended") with that run's id. It waits the few seconds until that run is
# complete (Studio reads the run's conclusion, and a job inside the run would still see it running), then starts the
# same hook a push to beta does (hawkes-studio.yml on beta), so Studio hears it the way it hears beta moving. It used to
# be a workflow_run trigger, which never fired: beta's Deploy runs are started by GITHUB_TOKEN, and GitHub starts no
# workflow from a GITHUB_TOKEN run's events; workflow_dispatch is the exception.
name: Beta CI ended
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: the Deploy run on beta that is ending
        type: string
        required: true
permissions:
  actions: write
concurrency:
  group: beta-ci-ended-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  tell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell Hawkes Studio that beta's CI ended
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be a run id"; exit 1; }
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --interval 5 > /dev/null || true
          gh workflow run hawkes-studio.yml --repo "$GITHUB_REPOSITORY" --ref beta
