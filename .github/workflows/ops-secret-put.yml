# Adds a new version of one of Studio's Secret Manager secrets from the GitHub secret of the matching name in the
# "production" environment (main only): STUDIO_GITHUB_TOKEN for studio-github-token, STUDIO_BETA_GITHUB_TOKEN for
# studio-beta-github-token. The value goes to gcloud on stdin. As ops-secrets, which may only add versions to these.
# Then run Deploy (ci.yml) on the lane so a new revision mounts :latest.
#   gh workflow run ops-secret-put.yml --repo jgriffith3433/hawkesstudio --ref main -f secret=studio-github-token
name: ops-secret-put
on:
  workflow_dispatch:
    inputs:
      secret:
        type: choice
        options: [studio-github-token, studio-beta-github-token]
permissions:
  contents: read
  id-token: write
concurrency:
  group: ops-secret-put
  cancel-in-progress: false
jobs:
  put:
    name: Add a secret version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-studio
          service_account: ops-secrets@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Add the version
        env:
          NAME: ${{ inputs.secret }}
          VALUE: ${{ secrets[fromJSON('{"studio-github-token":"STUDIO_GITHUB_TOKEN","studio-beta-github-token":"STUDIO_BETA_GITHUB_TOKEN"}')[inputs.secret]] }}
        run: |
          [ -n "$VALUE" ] || { echo "The GitHub secret for $NAME is empty in the production environment"; exit 1; }
          printf '%s' "$VALUE" | gcloud secrets versions add "$NAME" --project "${{ vars.GCP_PROJECT }}" --data-file=- --format='value(name)'
          echo "Added a version to $NAME. Run Deploy on the lane so a new revision mounts it." >> "$GITHUB_STEP_SUMMARY"
