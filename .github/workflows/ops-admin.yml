# One-time Google Cloud setup, done as ops-admin@hawkes-staging (made by Jaycee's ops-admin-setup.sh in Cloud Shell:
# keyless, usable only from this repo's main in the "production" environment). Every action is a PLAN by default: it
# reads what exists and prints the gcloud commands it would run. Tick "apply" to run them. Each step skips what exists.
#
#   gen-actas      gen-deployer@hawkes-staging gets roles/iam.serviceAccountUser on gen-playtest@ and gen-cpu@,
#                  so Gen's ops-service-deploy can deploy those services.
#   secret-create  makes Secret Manager secret <name> in <project> if missing and lets ops-secrets@<project> add
#                  versions to it (then ops-secret-put fills it); optional <accessor> may read it (a runtime account).
#   net-access     Hawkes Net VMs (hawkes-prod): a firewall rule letting Google's IAP range reach SSH on tag hawkes-web,
#                  WIF provider github-net (hawkesnet, main, production only) and ops-net@hawkes-prod with
#                  roles/iap.tunnelResourceAccessor and roles/compute.instanceAdmin.v1. VM metadata is not touched.
#   assets-bucket  gs://hawkes-assets-library (private, uniform access, versioned) in <project>, WIF provider
#                  github-assets (hawkes-assets, main, production only) and ops-assets@<project>, objectAdmin on
#                  that bucket only.
#   firebase-deployer  studio-cells@hawkes-staging (Studio's own account) gets roles/iam.serviceAccountTokenCreator on
#                  deployer@hawkes-staging and deployer@hawkes-prod, so Studio's Firebase builds (src/firebasebuild.ts)
#                  can sign in as those deployers for beta and live. Those two bindings only.
#   run-cpu-quota  asks Google for more Cloud Run CPU in one region of <project> (quota "Total CPU allocation, per
#                  project per region", run.googleapis.com): a quota preference of <value> vCPU in <region>. Free (only
#                  CPU actually used is billed). The plan prints the quota's current value and any pending request.
#   run-disk-quota the same for Cloud Run's ephemeral disk (the quota Google refused a cell's 10 GiB working disk on):
#                  a quota preference of <value> GiB in <region>. Free (only disk running instances use is billed).
#                  Studio starts both itself, with apply, when J approves its quota card (src/quota.ts).
#
#   gh workflow run ops-admin.yml --repo jgriffith3433/hawkesstudio --ref main -f action=gen-actas          (plan)
#   gh workflow run ops-admin.yml --repo jgriffith3433/hawkesstudio --ref main -f action=gen-actas -f apply=true
name: ops-admin
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [gen-actas, secret-create, net-access, assets-bucket, firebase-deployer, run-cpu-quota, run-disk-quota]
      apply:
        description: Run the commands (unticked = plan only)
        type: boolean
        default: false
      project:
        description: secret-create / assets-bucket project
        type: choice
        options: [hawkes-staging, hawkes-prod]
        default: hawkes-staging
      name:
        description: secret-create secret name (lowercase, digits, dashes)
        type: string
        default: ''
      accessor:
        description: secret-create, optional service account that may read it
        type: string
        default: ''
      region:
        description: run-cpu-quota / run-disk-quota region
        type: choice
        options: [us-east4, us-central1, us-west1]
        default: us-east4
      value:
        description: run-cpu-quota vCPU (21 to 400) / run-disk-quota GiB (11 to 2000) wanted in that region
        type: string
        default: '100'
      studio:
        description: run-cpu-quota / run-disk-quota, the Studio that asked (its address); the run reports back to it
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
concurrency:
  group: ops-admin
  cancel-in-progress: false
jobs:
  admin:
    name: ${{ inputs.action }} (${{ inputs.apply && 'apply' || 'plan' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-ops-admin/providers/github-ops-admin
          service_account: ops-admin@hawkes-staging.iam.gserviceaccount.com
      # The quota actions use `gcloud beta quotas`; installed here, since gcloud asks before installing it and a workflow
      # can't answer (2026-11-11: Jaycee's disk quota card failed on that prompt).
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta
      - name: Run
        id: run
        env:
          ACTION: ${{ inputs.action }}
          APPLY: ${{ inputs.apply }}
          PROJECT: ${{ inputs.project }}
          NAME: ${{ inputs.name }}
          ACCESSOR: ${{ inputs.accessor }}
          REGION: ${{ inputs.region }}
          VALUE: ${{ inputs.value }}
        run: |
          set -euo pipefail
          sum() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; echo "$*" >> "$RUNNER_TEMP/said.txt"; echo "$*"; }
          # Quota runs keep their errors too, for the report to Studio (last step).
          case "$ACTION" in run-*-quota) exec 2> >(tee -a "$RUNNER_TEMP/stderr.txt" >&2);; esac
          # do: print the command, run it only when applying.
          do_() { sum "    \$ $*"; if [ "$APPLY" = "true" ]; then "$@"; fi; }
          have() { "$@" >/dev/null 2>&1; }
          num() { gcloud projects describe "$1" --format='value(projectNumber)'; }
          case "$PROJECT" in hawkes-staging|hawkes-prod) ;; *) echo "bad project"; exit 1;; esac
          sum "## ops-admin: $ACTION ($([ "$APPLY" = true ] && echo apply || echo 'plan only'))"

          # A keyless GitHub provider in pool "github" of $1 trusting repo $3 (id $4) on main in production.
          provider() {
            local p=$1 prov=$2 repo=$3 id=$4
            have gcloud iam workload-identity-pools describe github --location=global --project "$p" \
              || do_ gcloud iam workload-identity-pools create github --location=global --project "$p" --display-name='GitHub Actions'
            local cond="assertion.repository_id=='$id' && assertion.repository_owner_id=='44073795' && assertion.ref=='refs/heads/main' && assertion.environment=='production'"
            if have gcloud iam workload-identity-pools providers describe "$prov" --workload-identity-pool=github --location=global --project "$p"; then
              sum "- provider $prov exists in $p (condition reset to main + production)"
              do_ gcloud iam workload-identity-pools providers update-oidc "$prov" --workload-identity-pool=github --location=global --project "$p" --attribute-condition="$cond"
            else
              do_ gcloud iam workload-identity-pools providers create-oidc "$prov" --workload-identity-pool=github --location=global --project "$p" \
                --display-name="$repo main" --issuer-uri='https://token.actions.githubusercontent.com' \
                --attribute-mapping='google.subject=assertion.sub,attribute.repository=assertion.repository,attribute.ref=assertion.ref,attribute.environment=assertion.environment' \
                --attribute-condition="$cond"
            fi
          }
          # A service account $2@$1 that repo $3's GitHub tokens (pool github of $1) may act as.
          account() {
            local p=$1 n=$2 repo=$3 sa="$2@$1.iam.gserviceaccount.com"
            if have gcloud iam service-accounts describe "$sa" --project "$p"; then sum "- $sa exists"
            else do_ gcloud iam service-accounts create "$n" --project "$p" --display-name="$repo GitHub Actions (main)"; if [ "$APPLY" = true ]; then sleep 15; fi; fi
            do_ gcloud iam service-accounts add-iam-policy-binding "$sa" --project "$p" --role=roles/iam.workloadIdentityUser \
              --member="principalSet://iam.googleapis.com/projects/$(num "$p")/locations/global/workloadIdentityPools/github/attribute.repository/$repo" --format=none
          }

          # Cloud Run CPU or ephemeral disk in $REGION (run-cpu-quota / run-disk-quota). Reads the quota from Google's
          # quota info (fields quotaDisplayName and metricUnit: displayName and unit don't exist, so every unit read as ''
          # and run 20, J's approved disk ask, stopped on "unexpected unit ''"), the region's value or else the default,
          # and the request already filed. With apply it files (or updates) preference run-<kind>-<region>. Every run
          # writes what it found to $RUNNER_TEMP/quota.json, which the last step reports to Studio.
          rep() { local f="$RUNNER_TEMP/quota.json"; [ -f "$f" ] || echo '{}' > "$f"; jq --arg k "$1" --argjson v "$2" '.[$k] = $v' "$f" > "$f.n" && mv "$f.n" "$f"; }
          quota() {
            local kind=$1 qid unit cur want per pref name
            case "$kind" in
              cpu) [[ "$VALUE" =~ ^[0-9]+$ ]] && [ "$VALUE" -ge 21 ] && [ "$VALUE" -le 400 ] || { sum "- value must be a whole number of vCPU, 21 to 400"; exit 1; }
                   name='CPU allocation, per project per region'; idre='^CpuAllocPerProjectRegion$';;
              disk) [[ "$VALUE" =~ ^[0-9]+$ ]] && [ "$VALUE" -ge 11 ] && [ "$VALUE" -le 2000 ] || { sum "- value must be a whole number of GiB, 11 to 2000"; exit 1; }
                   name='ephemeral'; idre='ephemeral';;
            esac
            do_ gcloud services enable cloudquotas.googleapis.com --project "$PROJECT"
            gcloud beta quotas info list --service=run.googleapis.com --project="$PROJECT" --format=json > qi.json || { sum "- couldn't read Cloud Run's quotas (ops-admin needs roles/cloudquotas.admin)"; exit 1; }
            qid=$(jq -r --arg n "$name" --arg i "$idre" '[.[] | select(((.quotaDisplayName // .displayName // "") | test($n; "i")) or ((.quotaId // "") | test($i; "i")))][0].quotaId // empty' qi.json)
            [ -n "$qid" ] || { jq -r '.[] | "\(.quotaId)\t\(.quotaDisplayName // "")\t\(.metricUnit // "")"' qi.json | head -40; sum "- no $kind quota found in Cloud Run's quotas"; exit 1; }
            unit=$(jq -r --arg q "$qid" '.[] | select(.quotaId==$q) | .metricUnit // .unit // ""' qi.json)
            cur=$(jq -r --arg q "$qid" --arg r "$REGION" '[.[] | select(.quotaId==$q) | .dimensionsInfos[]?] as $d | ([$d[] | select((.dimensions.region // "")==$r) | .details.value][0] // [$d[] | select((.dimensions.region // "")=="") | .details.value][0] // "?")' qi.json)
            sum "- quota $qid (unit ${unit:-none given}): $REGION is $cur now"
            # How many of the quota's units make one vCPU or GiB. Without a unit that says, the current value does (no
            # region has over 1000 vCPU or a petabyte of disk; us-east4's 20 vCPU read 20000 on 2026-11-11).
            if [ "$kind" = cpu ]; then
              case "$unit" in *milli*|*"1000"*) per=1000;; *) if [[ "$cur" =~ ^[0-9]+$ ]] && [ "$cur" -gt 1000 ]; then per=1000; else per=1; fi;; esac
            else
              case "$unit" in GiB*|GB*|*gibibyte*|*gigabyte*) per=1;; MiB*|MB*|*mebibyte*|*megabyte*) per=1024;; By*|*byte*) per=$((1024 * 1024 * 1024));;
                *) if [[ "$cur" =~ ^[0-9]+$ ]] && [ "$cur" -ge $((1024 * 1024 * 1024)) ]; then per=$((1024 * 1024 * 1024)); elif [[ "$cur" =~ ^[0-9]+$ ]] && [ "$cur" -ge 1048576 ]; then per=1024; else per=1; fi
                   sum "- the quota's unit (${unit:-none}) isn't a size: taking $([ $per = 1 ] && echo GiB || { [ $per = 1024 ] && echo MiB || echo bytes; }) from the current value";; esac
            fi
            [[ "$cur" =~ ^[0-9]+$ ]] && rep current "$(( cur / per ))"
            want=$((VALUE * per))
            sum "- asking for $VALUE $([ "$kind" = cpu ] && echo vCPU || echo GiB) ($want in the quota's unit) in $REGION"
            pref="run-$kind-$REGION"
            local why="Hawkes Studio cells need their 10 GiB working disk in $REGION"; [ "$kind" = cpu ] && why="Hawkes Studio and Gen live services plus builds need more than the default in $REGION"
            if have gcloud beta quotas preferences describe "$pref" --project="$PROJECT"; then
              do_ gcloud beta quotas preferences update "$pref" --project="$PROJECT" --service=run.googleapis.com --quota-id="$qid" --preferred-value="$want" --dimensions=region="$REGION" --justification="$why"
            else
              do_ gcloud beta quotas preferences create --preference-id="$pref" --project="$PROJECT" --service=run.googleapis.com --quota-id="$qid" --preferred-value="$want" --dimensions=region="$REGION" --justification="$why"
            fi
            # The request as Google has it (plan runs too: that is how Studio hears Google's answer to a filed ask).
            if gcloud beta quotas preferences describe "$pref" --project="$PROJECT" --format=json > pref.json 2>/dev/null; then
              jq -r '{preferredValue: .quotaConfig.preferredValue, grantedValue: .quotaConfig.grantedValue, stateDetail: .quotaConfig.stateDetail, reconciling: .reconciling}' pref.json | tee -a "$GITHUB_STEP_SUMMARY"
              local p g
              p=$(jq -r '.quotaConfig.preferredValue // empty' pref.json); g=$(jq -r '.quotaConfig.grantedValue // empty' pref.json)
              [[ "$p" =~ ^[0-9]+$ ]] && rep preferred "$(( p / per ))"
              [[ "$g" =~ ^[0-9]+$ ]] && rep granted "$(( g / per ))"
              rep reconciling "$(jq '.reconciling // false' pref.json)"
            else sum "- no request $pref filed yet"; fi
          }

          case "$ACTION" in
          gen-actas)
            for t in gen-playtest gen-cpu; do
              sa="$t@hawkes-staging.iam.gserviceaccount.com"
              if have gcloud iam service-accounts describe "$sa" --project hawkes-staging; then
                do_ gcloud iam service-accounts add-iam-policy-binding "$sa" --project hawkes-staging --role=roles/iam.serviceAccountUser \
                  --member=serviceAccount:gen-deployer@hawkes-staging.iam.gserviceaccount.com --format=none
              else sum "- $sa doesn't exist: skipped"; fi
            done
            sum "Then run Gen's ops-service-deploy." ;;
          secret-create)
            [[ "$NAME" =~ ^[a-z][a-z0-9-]{2,62}$ ]] || { echo "name must be lowercase letters, digits and dashes"; exit 1; }
            if [ -n "$ACCESSOR" ] && ! [[ "$ACCESSOR" =~ ^[a-z][a-z0-9-]{4,29}@hawkes-(staging|prod)\.iam\.gserviceaccount\.com$ ]]; then
              echo "accessor must be a service account in hawkes-staging or hawkes-prod"; exit 1; fi
            if have gcloud secrets describe "$NAME" --project "$PROJECT"; then sum "- secret $NAME exists in $PROJECT"
            else do_ gcloud secrets create "$NAME" --project "$PROJECT" --replication-policy=automatic; fi
            do_ gcloud secrets add-iam-policy-binding "$NAME" --project "$PROJECT" --role=roles/secretmanager.secretVersionAdder \
              --member="serviceAccount:ops-secrets@$PROJECT.iam.gserviceaccount.com" --format=none
            [ -z "$ACCESSOR" ] || do_ gcloud secrets add-iam-policy-binding "$NAME" --project "$PROJECT" --role=roles/secretmanager.secretAccessor \
              --member="serviceAccount:$ACCESSOR" --format=none
            sum "Then put the value in this repo's (or the owning repo's) production environment and run its ops-secret-put with $NAME added to its list." ;;
          net-access)
            P=hawkes-prod
            # ops-admin can read firewall rules but not instances: take the network from the VMs' own 80/443 rule.
            net=$(gcloud compute firewall-rules list --project $P --format='csv[no-heading](network.basename(),targetTags.list(separator=";"))' | awk -F, '$2 ~ /(^|;)hawkes-web(;|$)/{print $1; exit}')
            [ -n "$net" ] || { echo "no firewall rule targets tag hawkes-web in $P"; exit 1; }
            sum "- Hawkes Net VMs are on network $net (tag hawkes-web)"
            if have gcloud compute firewall-rules describe hawkes-ssh-iap --project $P; then sum "- firewall hawkes-ssh-iap exists"
            else do_ gcloud compute firewall-rules create hawkes-ssh-iap --project $P --network="$net" --direction=INGRESS --action=ALLOW \
              --rules=tcp:22 --source-ranges=35.235.240.0/20 --target-tags=hawkes-web --description='SSH to Hawkes Net through IAP only (GitHub Actions)'; fi
            do_ gcloud services enable iap.googleapis.com --project $P
            provider $P github-net jgriffith3433/hawkesnet 1435066440
            account $P ops-net jgriffith3433/hawkesnet
            for r in roles/iap.tunnelResourceAccessor roles/compute.instanceAdmin.v1; do
              do_ gcloud projects add-iam-policy-binding $P --member=serviceAccount:ops-net@$P.iam.gserviceaccount.com --role=$r --condition=None --format=none
            done
            sum "Then hawkesnet gets ops-net-status (gcloud compute ssh --tunnel-through-iap) as a PR." ;;
          assets-bucket)
            B=gs://hawkes-assets-library
            if have gcloud storage buckets describe $B; then sum "- $B exists"
            else do_ gcloud storage buckets create $B --project "$PROJECT" --location=us-east4 --uniform-bucket-level-access --public-access-prevention
                 do_ gcloud storage buckets update $B --versioning; fi
            provider "$PROJECT" github-assets jgriffith3433/hawkes-assets 1423637725
            account "$PROJECT" ops-assets jgriffith3433/hawkes-assets
            do_ gcloud storage buckets add-iam-policy-binding $B --member="serviceAccount:ops-assets@$PROJECT.iam.gserviceaccount.com" --role=roles/storage.objectAdmin
            sum "Then hawkes-assets gets its GCS sync and the S3 copy (once AWS is readable) as PRs." ;;
          firebase-deployer)
            for p in hawkes-staging hawkes-prod; do
              sa="deployer@$p.iam.gserviceaccount.com"
              if have gcloud iam service-accounts describe "$sa" --project "$p"; then
                do_ gcloud iam service-accounts add-iam-policy-binding "$sa" --project "$p" --role=roles/iam.serviceAccountTokenCreator \
                  --member=serviceAccount:studio-cells@hawkes-staging.iam.gserviceaccount.com --format=none
              else sum "- $sa doesn't exist: skipped"; fi
            done
            sum "Then rebuild the Firebase project in Studio (e.g. hawkes-games' firebase build)." ;;
          run-cpu-quota) quota cpu ;;
          run-disk-quota) quota disk ;;
          esac
          [ "$APPLY" = true ] && sum "Applied." || sum "Plan only: run again with apply ticked to make these changes."
      # A quota run tells the Studio that asked what it filed or found, or the real error (POST /api/hooks/quota with
      # GitHub's OIDC token; quota.ts onReport): the card shows it, and a failed filing opens the same card again
      # instead of Studio asking anew. Runs however the step above ended.
      - name: Report to Studio
        if: always() && (inputs.action == 'run-cpu-quota' || inputs.action == 'run-disk-quota') && inputs.studio != ''
        env:
          STUDIO: ${{ inputs.studio }}
          OUTCOME: ${{ steps.run.outcome }}
          ACTION: ${{ inputs.action }}
          APPLY: ${{ inputs.apply }}
          REGION: ${{ inputs.region }}
          VALUE: ${{ inputs.value }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          [[ "$STUDIO" =~ ^https://studio(-beta)?\.hawkesgen\.ai(/o/[a-z0-9-]+)?$ ]] || { echo "studio must be a Hawkes Studio address"; exit 1; }
          kind=cpu; [ "$ACTION" = run-disk-quota ] && kind=disk
          f="$RUNNER_TEMP/quota.json"; [ -f "$f" ] || echo '{}' > "$f"
          err=""
          if [ "$OUTCOME" != success ]; then err=$( { tail -n 4 "$RUNNER_TEMP/said.txt" 2>/dev/null; grep -v '^\s*$' "$RUNNER_TEMP/stderr.txt" 2>/dev/null | tail -n 4; } | tr '\n' ' ' | cut -c1-600); [ -n "$err" ] || err="the ops-admin step ended $OUTCOME"; fi
          body=$(jq -c --arg k "$kind" --arg r "$REGION" --arg v "$VALUE" --arg a "$APPLY" --arg o "$OUTCOME" --arg e "$err" --arg run "$RUN_ID" \
            '. + {kind: $k, region: $r, value: ($v | tonumber), apply: ($a == "true"), ok: ($o == "success"), error: (if $e == "" then null else $e end), run: $run}' "$f")
          echo "$body"
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$STUDIO" | jq -r .value)
          curl -sS --fail-with-body --retry 6 --retry-delay 10 --retry-all-errors -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data "$body" "$STUDIO/api/hooks/quota"
