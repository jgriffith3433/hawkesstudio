# Deploys Studio to Cloud Run (docs/studio-cloudrun.md, "Deploys"). The lanes (J, 2026-10-28: dev -> beta -> main): a
# push to beta deploys `studio-beta` and its job `studio-agent-beta` (studio-beta.hawkesgen.ai, on gen-beta), a push to
# main deploys `studio` and `studio-agent` (studio.hawkesgen.ai); dev deploys nothing.
# No tests here (J, 2026-10-25: "i don't want github running the tests anymore"): run `npm run typecheck` and
# `npm test` before pushing. The safety net is the health check: a new revision that doesn't answer its lane's
# /api/health is replaced by the one before it (the job keeps its old image too).
# Keyless: GitHub's OIDC token is traded for the `studio-deployer` account through Workload Identity Federation, trusted
# for this repo's main and beta only (tools/studio-cloudrun/setup-ci.ps1 sets that up once).
name: Deploy
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
concurrency:
  group: deploy-studio-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  PROJECT: hawkes-staging
  PROJECT_NUMBER: '388576319982'
  REGION: us-east4
jobs:
  deploy:
    name: Build and deploy to Cloud Run
    if: github.ref_name == 'main' || github.ref_name == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    steps:
      - name: The lane
        run: |
          # beta runs in us-central1 (its own 20 vCPUs, J 2026-10-29: hawkesstudio infra/README.md); images stay in $REGION's registry.
          if [ "$GITHUB_REF_NAME" = beta ]; then
            echo "RUN_REGION=us-central1" >> "$GITHUB_ENV"
            echo "SERVICE=studio-beta" >> "$GITHUB_ENV"; echo "JOB=studio-agent-beta" >> "$GITHUB_ENV"
            echo "HEALTH=https://studio-beta.hawkesgen.ai/api/health" >> "$GITHUB_ENV"
          else
            echo "RUN_REGION=$REGION" >> "$GITHUB_ENV"
            echo "SERVICE=studio" >> "$GITHUB_ENV"; echo "JOB=studio-agent" >> "$GITHUB_ENV"
            echo "HEALTH=https://studio.hawkesgen.ai/api/health" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-studio
          service_account: studio-deployer@${{ env.PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build the image for this commit
        run: node tools/studio-cloudrun/build.mjs --project "$PROJECT" --region "$REGION" --commit "$GITHUB_SHA" --apply
      - name: Deploy it, keeping the previous revision to fall back on
        env:
          STARTUP_PROBE: tcpSocket.port=8080,initialDelaySeconds=0,periodSeconds=10,timeoutSeconds=5,failureThreshold=60
        run: |
          prev=$(gcloud run services describe "$SERVICE" --region "$RUN_REGION" --project "$PROJECT" --format='value(status.latestReadyRevisionName)')
          [ -n "$prev" ] || { echo "No $SERVICE service yet: J runs tools/studio-cloudrun/deploy.ps1 for this lane first"; exit 1; }
          prevJob=$(gcloud run jobs describe "$JOB" --region "$RUN_REGION" --project "$PROJECT" --format='value(spec.template.spec.template.spec.containers[0].image)')
          echo "prev=$prev" >> "$GITHUB_ENV"; echo "prevJob=$prevJob" >> "$GITHUB_ENV"
          tag=$(node -e "console.log(require('./.data/cloudrun/studio-image.json').tag)")
          # The startup probe goes with every deploy: a service made before tools/studio-cloudrun/deploy.mjs set it keeps
          # Cloud Run's default (one 4 minute try), which a restore of the live database can outlast. Same value as
          # deploy.mjs STARTUP_PROBE and src/cellrun.ts CELL_STARTUP_PROBE (test/cells.test.ts checks all three).
          gcloud run services update "$SERVICE" --image "$tag" --startup-probe "$STARTUP_PROBE" --region "$RUN_REGION" --project "$PROJECT" --format=none
          gcloud run jobs update "$JOB" --image "$tag" --region "$RUN_REGION" --project "$PROJECT" --format=none
      - name: Health check (back to the previous revision if it fails)
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$HEALTH" || true)
            [ "$code" = 200 ] && { echo "healthy"; exit 0; }
            sleep 10
          done
          echo "Not healthy: back to $prev"
          gcloud run services update-traffic "$SERVICE" --to-revisions "$prev=100" --region "$RUN_REGION" --project "$PROJECT" --format=none
          [ -n "$prevJob" ] && gcloud run jobs update "$JOB" --image "$prevJob" --region "$RUN_REGION" --project "$PROJECT" --format=none
          exit 1
  # Beta's CI is ending: tell Hawkes Studio once this run is over (beta-ci-ended.yml), so a go live waiting on its CI looks
  # again. A workflow_run trigger never fired here: beta's Deploy runs are started by GITHUB_TOKEN (beta-automerge.yml),
  # and GitHub starts no workflow from a GITHUB_TOKEN run's events (2026-11-10: #362's CI went green at 22:57 and
  # nothing woke Studio). A workflow_dispatch is the one event GITHUB_TOKEN may start, so this run starts it itself.
  ended:
    name: Tell Studio when beta's CI is over
    needs: deploy
    if: always() && github.ref_name == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run beta-ci-ended.yml --repo "$GITHUB_REPOSITORY" --ref beta -f run_id="$GITHUB_RUN_ID"
