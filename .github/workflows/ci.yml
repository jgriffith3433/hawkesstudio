# No tests here (J, 2026-10-25: "i don't want github running the tests anymore"): the control server runs typecheck and
# the tests on each new main commit itself before it deploys it (hawkesstudio/deploy/hawkes-pull.mjs testOnServer), and
# Studio runs them on every agent change before it merges (src/agents.ts verifyInfra). This workflow only tells the
# server that main moved, so it doesn't poll. Studio checks GitHub's OIDC token (this repo, main) and the server pulls
# the commit itself.
name: CI
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tell-server:
    name: Tell the server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Tell the control server to deploy this commit
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://studio.hawkesgen.com" | jq -r .value)
          curl -sS --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $token" https://studio.hawkesgen.com/api/hooks/self-deploy
