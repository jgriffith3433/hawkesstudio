# Typecheck and tests on every push and pull request. The control server deploys a commit on main only after
# this passes (hawkesstudio/deploy/hawkes-pull.mjs checks the commit's check runs).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The beta-lane and dev tests make git repos and commits.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      # Without Hawkes Gen running here, the asset test skips itself; the rest need nothing else.
      - run: npm test
        env:
          HAWKESGEN_URL: http://127.0.0.1:8790

  # On main, once the tests pass: tell the control server to deploy this commit (no polling). Studio checks GitHub's
  # OIDC token (this repo, main) and the server pulls it itself (hawkesstudio/deploy/hawkes-pull.mjs). The server
  # ignores this job when it checks CI, since this job is what starts the check.
  tell-server:
    name: Tell the server
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Tell the control server to deploy this commit
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://studio.hawkesgen.com" | jq -r .value)
          curl -sS --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $token" https://studio.hawkesgen.com/api/hooks/self-deploy
