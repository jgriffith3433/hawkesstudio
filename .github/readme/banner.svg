<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="HAWKES STUDIO: the left stroke of the H: it decides">
<defs>
<linearGradient id="r" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0.0%" stop-color="#ff2d55"/><stop offset="14.3%" stop-color="#ff9500"/><stop offset="28.6%" stop-color="#ffd60a"/><stop offset="42.9%" stop-color="#30d158"/><stop offset="57.1%" stop-color="#0af"/><stop offset="71.4%" stop-color="#5e5ce6"/><stop offset="85.7%" stop-color="#bf5af2"/><stop offset="100.0%" stop-color="#ff2d55"/>
