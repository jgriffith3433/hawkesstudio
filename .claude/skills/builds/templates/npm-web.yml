# npm web build on GitHub's runners (npm ci, npm run build), then tells Hawkes Studio it's ready.
# Use it when the build needs their own runners or steps; otherwise a Studio npm build (tool "npm") needs no workflow.
# Runs on pushes to beta, build-* tags, and by hand (Actions tab, or Studio when asked).
# Secrets: none (add any the build itself needs as repo secrets and pass them in the Build step's env).
# Placeholders: STUDIO_URL (no trailing slash), BUILD_ID, ARTIFACT, PROJECT_PATH (the folder with package.json), OUT (e.g. dist).
name: Build {{BUILD_ID}} (npm web)

on:
  push:
    branches: [beta]
    tags: ['build-*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-{{BUILD_ID}}-${{ github.ref }}
  cancel-in-progress: true

env:
  STUDIO: "{{STUDIO_URL}}"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "{{PROJECT_PATH}}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "{{PROJECT_PATH}}/package-lock.json"

      - name: Build
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: "{{ARTIFACT}}"
          path: "{{PROJECT_PATH}}/{{OUT}}/"
          if-no-files-found: error
          retention-days: 7

  notify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell Hawkes Studio
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$STUDIO" | jq -r .value)
          curl -sS --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors -X POST "$STUDIO/api/hooks/github" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{"kind":"build","build":"{{BUILD_ID}}","artifact":"{{ARTIFACT}}"}'
