# Unity WebGL build with GameCI, then tells Hawkes Studio it's ready.
# Runs on pushes to beta, build-* tags, and by hand (Actions tab, or Studio when asked).
# Secrets (repo Settings > Secrets and variables > Actions): UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.
# Placeholders: STUDIO_URL (no trailing slash), BUILD_ID, ARTIFACT, PROJECT_PATH, UNITY_VERSION ("auto" reads ProjectVersion.txt).
name: Build {{BUILD_ID}} (Unity WebGL)

on:
  push:
    branches: [beta]
    tags: ['build-*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-{{BUILD_ID}}-${{ github.ref }}
  cancel-in-progress: true

env:
  STUDIO: "{{STUDIO_URL}}"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: "{{PROJECT_PATH}}/Library"
          key: Library-{{BUILD_ID}}-WebGL-${{ hashFiles('{{PROJECT_PATH}}/Assets/**', '{{PROJECT_PATH}}/Packages/**', '{{PROJECT_PATH}}/ProjectSettings/**') }}
          restore-keys: |
            Library-{{BUILD_ID}}-WebGL-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: "{{PROJECT_PATH}}"
          unityVersion: "{{UNITY_VERSION}}"
          targetPlatform: WebGL
          buildsPath: build
          buildName: game

      # GameCI writes WebGL to build/WebGL/<buildName>/ (index.html inside): upload that folder's contents.
      - uses: actions/upload-artifact@v4
        with:
          name: "{{ARTIFACT}}"
          path: build/WebGL/game/
          if-no-files-found: error
          retention-days: 7

  notify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell Hawkes Studio
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$STUDIO" | jq -r .value)
          curl -sS --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors -X POST "$STUDIO/api/hooks/github" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{"kind":"build","build":"{{BUILD_ID}}","artifact":"{{ARTIFACT}}"}'
