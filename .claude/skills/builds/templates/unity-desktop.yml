# Unity desktop builds (Windows 64-bit and Linux 64-bit) with GameCI, then tells Hawkes Studio each one is ready.
# One Studio build per target: {{BUILD_ID}}-windows and {{BUILD_ID}}-linux, artifacts {{ARTIFACT}}-windows and
# {{ARTIFACT}}-linux (GitHub stores each artifact as a zip; Studio publishes it as <target>.zip).
# Runs on pushes to beta, build-* tags, and by hand (Actions tab, or Studio when asked).
# Secrets (repo Settings > Secrets and variables > Actions): UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.
# Placeholders: STUDIO_URL (no trailing slash), BUILD_ID, ARTIFACT, PROJECT_PATH, UNITY_VERSION ("auto" reads ProjectVersion.txt).
name: Build {{BUILD_ID}} (Unity desktop)

on:
  push:
    branches: [beta]
    tags: ['build-*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-{{BUILD_ID}}-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  STUDIO: "{{STUDIO_URL}}"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: StandaloneWindows64
            target: windows
          - platform: StandaloneLinux64
            target: linux
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: "{{PROJECT_PATH}}/Library"
          key: Library-{{BUILD_ID}}-${{ matrix.platform }}-${{ hashFiles('{{PROJECT_PATH}}/Assets/**', '{{PROJECT_PATH}}/Packages/**', '{{PROJECT_PATH}}/ProjectSettings/**') }}
          restore-keys: |
            Library-{{BUILD_ID}}-${{ matrix.platform }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: "{{PROJECT_PATH}}"
          unityVersion: "{{UNITY_VERSION}}"
          targetPlatform: ${{ matrix.platform }}
          buildsPath: build
          buildName: game

      # GameCI writes desktop builds to build/<platform>/ (game.exe or game.x86_64 plus its _Data folder): upload its contents.
      - uses: actions/upload-artifact@v4
        with:
          name: "{{ARTIFACT}}-${{ matrix.target }}"
          path: build/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  notify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        target: [windows, linux]
    steps:
      - name: Tell Hawkes Studio
        env:
          TARGET: ${{ matrix.target }}
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$STUDIO" | jq -r .value)
          curl -sS --fail-with-body --retry 3 --retry-delay 10 --retry-all-errors -X POST "$STUDIO/api/hooks/github" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{"kind":"build","build":"{{BUILD_ID}}-'"$TARGET"'","artifact":"{{ARTIFACT}}-'"$TARGET"'"}'
