<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hawkes Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23101418'/><path d='M8 8v16M24 8v16M8 16h16' stroke='%2333d6a6' stroke-width='3.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark">H</span> Hawkes Studio <small>clinical trials, daily</small></div>
    <nav>
      <button data-tab="talk">Talk</button>
      <button data-tab="today" class="on">Today</button>
      <button data-tab="ready">Ready to test</button>
      <button data-tab="roadmap">Roadmap</button>
      <button data-tab="report">Report</button>
      <button data-tab="playtests">Playtests</button>
      <button data-tab="backlog">Backlog</button>
      <button data-tab="changes">Changes</button>
      <button data-tab="runs">Runs</button>
      <button data-tab="costs">Costs</button>
    </nav>
    <div class="status" id="status"></div>
    <button id="actBtn" class="act-btn" title="Everything running in the background: agents, runs, Hawkes Gen jobs">Activity <span class="act-count zero" id="actCount">0</span></button>
  </header>
  <aside id="activity" class="activity" hidden>
    <div class="act-head"><b>Activity</b><span class="meta" id="actUpdated"></span><button class="small" id="actClose" title="Close">×</button></div>
    <div id="actBody"><div class="meta">Loading…</div></div>
  </aside>
  <main>
    <section id="talk" class="tab">
      <div class="talk">
        <aside id="talkList"></aside>
        <div class="talk-main">
          <div id="talkHead" class="talk-head"></div>
          <div id="talkLog" class="talk-log"></div>
          <div id="talkFiles" class="talk-files"></div>
          <div class="talk-input">
            <button id="talkAttach" title="Attach an image or file">📎</button><input type="file" id="talkFile" multiple hidden>
            <textarea id="talkInput" rows="2" placeholder="Talk about the products, ask for work, approve changes…"></textarea>
            <button class="primary" id="talkSend">Send</button><button id="talkStop" hidden>Stop</button>
            <button id="talkCall" class="talk-call" title="Call Talk: talk out loud, Talk answers aloud">📞</button>
          </div>
          <div id="callPane" class="call" data-state="connecting" hidden>
            <div class="call-top"><b>📞 On a call with Talk</b><button class="small" id="callSettingsBtn" title="Call settings">⚙</button></div>
            <div id="callSettings" class="call-settings" hidden><div id="callSettingsBody"></div></div>
            <button id="callOrb" class="call-orb" title="Tap to interrupt Talk, or to send what you said now"></button>
            <div id="callState" class="call-state">Connecting…</div>
            <div id="callYou" class="call-you"></div>
            <div id="callNote" class="call-note"></div>
            <button id="callPtt" class="call-ptt" hidden>Hold to talk</button>
            <div class="call-buttons"><button id="callMute">Mute</button><button id="callHang" class="call-hang">Hang up</button></div>
            <div id="callLatency" class="call-latency"></div>
          </div>
          <div class="meta" id="talkBilling"></div>
          <details id="notifyBox" class="meta"><summary>Phone notifications</summary><div id="notifyBody"></div></details>
        </div>
      </div>
    </section>
    <section id="today" class="tab on">
      <div class="bar">
        <button class="primary" id="runDaily">Run daily trials</button>
        <button id="runSmoke">Smoke-test everything</button>
        <label><input type="checkbox" id="optNoBuild"> skip Unity builds</label>
        <label><input type="checkbox" id="optLocal"> local only</label>
        <span id="runInfo"></span>
      </div>
      <div id="cards" class="cards"></div>
    </section>
    <section id="ready" class="tab">
      <div class="bar"><span class="meta">Roadmap items on beta: what changed, which acceptance criteria were verified (with videos), how to try it, and the known bugs.</span></div>
      <div id="readyMs" class="cards" style="grid-template-columns:1fr"></div>
      <div id="readyList" class="cards" style="grid-template-columns:1fr"></div>
    </section>
    <section id="roadmap" class="tab">
      <div class="bar">
        <select id="rmProduct"><option value="">All products</option></select>
        <select id="rmStatus"><option value="">All (not dropped)</option><option value="idea">Ideas</option><option value="planned,in progress">Planned and in progress</option><option value="on beta">On beta</option><option value="live,done">Live and done</option><option value="dropped">Dropped</option></select>
        <button class="small" id="rmNew">New item</button>
        <button class="small" id="rmNewMs">New milestone</button>
      </div>
      <div id="rmPm" class="meta" style="margin:8px 0"></div>
      <div id="rmQuestions"></div>
      <div id="rmMilestones"></div>
      <div id="rmList"></div>
      <details id="rmLog" class="meta"></details>
    </section>
    <section id="report" class="tab">
      <div class="bar"><select id="reportRun"></select> <a id="reportMd" target="_blank">Markdown</a></div>
      <div id="reportBody"></div>
    </section>
    <section id="playtests" class="tab">
      <div id="ptListView"><div class="bar" id="ptBar"></div><div id="ptTrends"></div><div id="ptList"></div></div>
      <div id="ptDetail"></div>
    </section>
    <section id="backlog" class="tab">
      <div class="bar">
        <select id="blProduct"><option value="">All products</option></select>
        <select id="blStatus" title="Backlog: blockers and bugs. Ideas: polish and ideas (never auto-fixed; expire after 14 days unseen)"><option value="open,fixing">Open</option><option value="idea">Ideas</option><option value="fixed">Fixed</option><option value="wontfix">Won't fix</option><option value="expired">Expired ideas</option><option value="open,fixing,fixed,wontfix,idea,expired">All</option></select>
        <span id="blCount"></span>
      </div>
      <div id="blList"></div>
    </section>
    <section id="changes" class="tab">
      <div class="bar"><select id="chStatus"><option value="queued,working,verifying,revising,ready">Active</option><option value="ready">Ready for you</option><option value="merged">Merged</option><option value="failed,closed">Failed or closed</option><option value="">All</option></select> <span id="chInfo" class="meta"></span></div>
      <div id="chList"></div>
    </section>
    <section id="costs" class="tab">
      <div class="bar">
        <select id="coPeriod"><option value="month">This month</option><option value="week">Last 7 days</option><option value="today">Today</option><option value="lastmonth">Last month</option><option value="30d">Last 30 days</option></select>
        <button class="small" id="coRefresh" title="Fetch fresh Cost Explorer numbers ($0.01 per request; anything under an hour old is reused)">Refresh</button>
        <button class="small" id="coSettings">Budget and alerts…</button>
        <button class="small" id="coAlerts" title="Phone alerts: forecast over budget, a server left running, charges outside the US regions">Alerts on/off</button>
        <span id="coBudget" class="meta"></span>
      </div>
      <div id="costsBody"></div>
    </section>
    <section id="runs" class="tab">
      <div id="runList"></div>
      <div id="runDetail"></div>
    </section>
  </main>
  <div id="viewer" class="viewer" hidden><div class="inner"><button class="close">×</button><div class="content"></div></div></div>
  <script src="app.js"></script>
  <script src="talk.js"></script>
  <script src="call.js"></script>
  <script src="playtests.js"></script>
  <script src="activity.js"></script>
  <script src="roadmap.js"></script>
  <script src="costs.js"></script>
</body>
</html>
